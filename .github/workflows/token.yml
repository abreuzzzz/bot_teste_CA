name: 🔑 Gerar Token Conta Azul

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Cole o 'code' da URL de callback (deixe vazio para gerar o link)"
        required: false
        default: ""

env:
  # ✏️ EDITE AQUI com seus valores reais
  CLIENT_ID:    "752lr5sf6gl561ao37k0e40k4s"
  REDIRECT_URI: "https://contaazul.com"

jobs:
  gerar-token:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests PyNaCl

      # ── EXECUÇÃO 1: Gerar link ────────────────────────────────────────────
      - name: Passo 1 — Gerar link de autorização
        if: ${{ github.event.inputs.auth_code == '' }}
        run: |
          python - <<'EOF'
          import urllib.parse, os

          AUTH_URL = "https://api-v2.contaazul.com/auth/realms/contaazul/protocol/openid-connect/auth"

          params = urllib.parse.urlencode({
              "client_id":     os.environ["CLIENT_ID"],
              "redirect_uri":  os.environ["REDIRECT_URI"],
              "response_type": "code",
              "scope":         "openid",
          })

          link = f"{AUTH_URL}?{params}"

          print("=" * 80)
          print("ABRA ESTE LINK NO NAVEGADOR E AUTORIZE:")
          print("=" * 80)
          print(link)
          print("=" * 80)
          print()
          print("Após autorizar, você será redirecionado para:")
          print(f"  {os.environ['REDIRECT_URI']}?code=XXXXXXXX&...")
          print()
          print("Se usou https://httpbin.org/get, o JSON da página mostra:")
          print('  "args": { "code": "VALOR_AQUI" }')
          print()
          print("Copie o valor do code e rode este workflow novamente colando no campo.")
          EOF

      # ── EXECUÇÃO 2: Trocar code → salvar secret ───────────────────────────
      - name: Passo 2 — Trocar code por token e salvar secret
        if: ${{ github.event.inputs.auth_code != '' }}
        env:
          CLIENT_SECRET: ${{ secrets.CONTA_AZUL_CLIENT_SECRET }}
          AUTH_CODE:     ${{ github.event.inputs.auth_code }}
          GH_TOKEN:      ${{ secrets.GH_PAT }}
          GH_REPO:       ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os, json, requests
          from base64 import b64encode
          from nacl import encoding, public

          TOKEN_URL     = "https://api-v2.contaazul.com/auth/realms/contaazul/protocol/openid-connect/token"
          CLIENT_ID     = os.environ["CLIENT_ID"]
          CLIENT_SECRET = os.environ["CLIENT_SECRET"]
          REDIRECT_URI  = os.environ["REDIRECT_URI"]
          AUTH_CODE     = os.environ["AUTH_CODE"].strip()
          GH_TOKEN      = os.environ["GH_TOKEN"]
          GH_REPO       = os.environ["GH_REPO"]

          print(f"Trocando code pelo token...")
          print(f"  client_id:    {CLIENT_ID}")
          print(f"  redirect_uri: {REDIRECT_URI}")
          print(f"  code:         {AUTH_CODE[:20]}...")

          r = requests.post(TOKEN_URL, data={
              "grant_type":    "authorization_code",
              "client_id":     CLIENT_ID,
              "client_secret": CLIENT_SECRET,
              "redirect_uri":  REDIRECT_URI,
              "code":          AUTH_CODE,
          }, timeout=20)

          print(f"\nResposta Conta Azul: HTTP {r.status_code}")

          if r.status_code != 200:
              print(f"ERRO: {r.text}")
              exit(1)

          tokens      = r.json()
          tokens_json = json.dumps(tokens)

          print(f"\naccess_token:  {tokens['access_token'][:50]}...")
          print(f"refresh_token: {tokens['refresh_token'][:50]}...")
          print(f"expires_in:    {tokens.get('expires_in')}s")

          # ── Salva no GitHub Secret ─────────────────────────────────────
          headers = {
              "Authorization": f"token {GH_TOKEN}",
              "Accept":        "application/vnd.github+json",
          }

          pk = requests.get(
              f"https://api.github.com/repos/{GH_REPO}/actions/secrets/public-key",
              headers=headers,
          ).json()

          print(f"\nPublic key GitHub: {pk['key_id']}")

          sealed    = public.SealedBox(
              public.PublicKey(pk["key"].encode(), encoding.Base64Encoder)
          ).encrypt(tokens_json.encode())
          encrypted = b64encode(sealed).decode()

          resp = requests.put(
              f"https://api.github.com/repos/{GH_REPO}/actions/secrets/CONTA_AZUL_TOKENS",
              headers=headers,
              json={"encrypted_value": encrypted, "key_id": pk["key_id"]},
          )

          print(f"Salvar secret: HTTP {resp.status_code}")

          if resp.status_code in (201, 204):
              print("\n✅ Secret CONTA_AZUL_TOKENS salvo no GitHub!")
              print()
              print("PROXIMO PASSO:")
              print("Copie o valor abaixo e adicione como variável CONTA_AZUL_TOKENS no Railway:")
              print()
              print(tokens_json)
          else:
              print(f"ERRO ao salvar secret: {resp.status_code} — {resp.text}")
              exit(1)
          EOF
