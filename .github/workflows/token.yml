name: 🔐 First Auth - Gerar Tokens Conta Azul

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: |
          Cole aqui o "code" capturado da URL de callback após autorizar.
          Deixe vazio e clique em Run para gerar a URL de autorização primeiro.
        required: false
        default: ""

jobs:
  first-auth:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests PyNaCl

      # ── EXECUÇÃO 1: Gerar URL ─────────────────────────────────────────────
      - name: Passo 1 — Gerar URL de autorização
        if: ${{ github.event.inputs.authorization_code == '' }}
        env:
          CLIENT_ID:    ${{ secrets.CONTA_AZUL_CLIENT_ID }}
          REDIRECT_URI: "https://contaazul.com"
        run: |
          python - <<'EOF'
          import os, urllib.parse

          params = urllib.parse.urlencode({
              "response_type": "code",
              "client_id":     os.environ["CLIENT_ID"],
              "redirect_uri":  os.environ["REDIRECT_URI"],
              "scope":         "openid",
              "state":         "bot_init",
          })

          url = f"https://auth.contaazul.com/oauth2/authorize?{params}"

          print("\n" + "=" * 70)
          print("PASSO 1: ABRA ESTA URL NO NAVEGADOR E AUTORIZE:")
          print("=" * 70)
          print(url)
          print("=" * 70)
          print()
          print("Após autorizar, o navegador vai redirecionar para contaazul.com")
          print("e pode dar erro de página — isso é NORMAL.")
          print()
          print("Olhe a barra de endereços. A URL vai ter este formato:")
          print("  https://contaazul.com/?code=XXXXXXXXXXXXXXXX&state=bot_init")
          print()
          print("Copie apenas o valor após 'code=' até o '&'")
          print("Depois rode este workflow novamente colando o code no campo.")
          print("=" * 70)
          EOF

      # ── EXECUÇÃO 2: Trocar code → salvar secret ───────────────────────────
      - name: Passo 2 — Trocar code por tokens e salvar secret
        if: ${{ github.event.inputs.authorization_code != '' }}
        env:
          CLIENT_ID:          ${{ secrets.CONTA_AZUL_CLIENT_ID }}
          CLIENT_SECRET:      ${{ secrets.CONTA_AZUL_CLIENT_SECRET }}
          AUTHORIZATION_CODE: ${{ github.event.inputs.authorization_code }}
          REDIRECT_URI:       "https://contaazul.com"
          GH_TOKEN:           ${{ secrets.GH_PAT }}
          REPO:               ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os, base64, json, time, requests
          from nacl import encoding, public

          CLIENT_ID     = os.environ["CLIENT_ID"]
          CLIENT_SECRET = os.environ["CLIENT_SECRET"]
          CODE          = os.environ["AUTHORIZATION_CODE"].strip()
          REDIRECT_URI  = os.environ["REDIRECT_URI"]
          GH_TOKEN      = os.environ["GH_TOKEN"]
          REPO          = os.environ["REPO"]

          print(f"client_id:    {CLIENT_ID}")
          print(f"redirect_uri: {REDIRECT_URI}")
          print(f"code:         {CODE[:30]}...")
          print()

          # ── 1. Troca code por tokens ──────────────────────────────────────
          b64 = base64.b64encode(f"{CLIENT_ID}:{CLIENT_SECRET}".encode()).decode()

          resp = requests.post(
              "https://auth.contaazul.com/oauth2/token",
              headers={
                  "Authorization": f"Basic {b64}",
                  "Content-Type":  "application/x-www-form-urlencoded",
              },
              data={
                  "grant_type":    "authorization_code",
                  "code":          CODE,
                  "redirect_uri":  REDIRECT_URI,
                  "client_id":     CLIENT_ID,
                  "client_secret": CLIENT_SECRET,
              },
              timeout=15,
          )

          print(f"Resposta Conta Azul: HTTP {resp.status_code}")
          if resp.status_code != 200:
              print(f"ERRO: {resp.text}")
              exit(1)

          data = resp.json()

          tokens_dict = {
              "access_token":  data["access_token"],
              "refresh_token": data["refresh_token"],
              "expires_at":    time.time() + data["expires_in"],
          }
          tokens_json = json.dumps(tokens_dict)

          print(f"access_token:  {data['access_token'][:50]}...")
          print(f"refresh_token: {data['refresh_token'][:50]}...")
          print(f"expires_in:    {data['expires_in']}s ({data['expires_in']//3600}h)")
          print()

          # ── 2. Salva como GitHub Secret CONTA_AZUL_TOKENS ─────────────────
          headers = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept":        "application/vnd.github+json",
          }

          pub = requests.get(
              f"https://api.github.com/repos/{REPO}/actions/secrets/public-key",
              headers=headers,
          ).json()

          pk        = public.PublicKey(pub["key"].encode(), encoding.Base64Encoder())
          encrypted = base64.b64encode(
              public.SealedBox(pk).encrypt(tokens_json.encode())
          ).decode()

          r = requests.put(
              f"https://api.github.com/repos/{REPO}/actions/secrets/CONTA_AZUL_TOKENS",
              headers=headers,
              json={"encrypted_value": encrypted, "key_id": pub["key_id"]},
          )
          r.raise_for_status()

          print("✅ Secret CONTA_AZUL_TOKENS salvo no GitHub!")
          print()
          print("=" * 70)
          print("PRÓXIMO PASSO — copie o JSON abaixo para o Railway:")
          print("  Railway → Variables → CONTA_AZUL_TOKENS → colar valor")
          print("=" * 70)
          print(tokens_json)
          print("=" * 70)
          print()
          print("access_token  válido por 1 hora (renovação automática pelo bot)")
          print("refresh_token válido por 5 anos")
          EOF
